interface:
  display_name: "GEOWorkFlow"
  short_description: "Manage GEOWorkFlow content, drafts and planned updates"
  default_prompt: "Use $geoflow with the selected CLI profile. Discover identity and capabilities, use saved plans and stable request IDs for Updater actions, preserve draft versions, verify receipts, and report unavailable operations."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
