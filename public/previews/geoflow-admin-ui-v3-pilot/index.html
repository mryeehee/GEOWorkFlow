<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GEOWorkFlow Admin UI V3 试点</title>
    <link rel="stylesheet" href="assets/css/pilot.css">
</head>
<body class="pilot-catalog">
    <main class="pilot-catalog__main">
        <header class="pilot-catalog__header">
            <div>
                <span class="pilot-eyebrow">GEOWorkFlow Admin UI V3</span>
                <h1>三类典型页面试点</h1>
                <p>用同一套公共侧栏、顶部栏与组件规范，验证运营首页、密集列表和复杂设置。</p>
            </div>
            <a class="gf-button" href="FINAL-PLAN.md">查看最终方案</a>
        </header>
        <section class="pilot-catalog__grid" aria-label="试点页面">
            <a class="pilot-card" href="pages/dashboard.html">
                <span class="pilot-card__number">01</span>
                <div><h2>数据中心</h2><p>验证运营总览、指标层级、趋势图和待处理事项。</p></div>
                <span class="pilot-card__action">打开页面 →</span>
            </a>
            <a class="pilot-card" href="pages/tasks.html">
                <span class="pilot-card__number">02</span>
                <div><h2>任务管理</h2><p>验证筛选、批量操作、宽表格、进度和状态密度。</p></div>
                <span class="pilot-card__action">打开页面 →</span>
            </a>
            <a class="pilot-card" href="pages/site-settings.html">
                <span class="pilot-card__number">03</span>
                <div><h2>网站设置</h2><p>验证复杂表单、页内导航、保存状态与权限归并。</p></div>
                <span class="pilot-card__action">打开页面 →</span>
            </a>
        </section>
        <p class="pilot-catalog__note">全部为独立只读原型，按钮仅展示交互反馈。</p>
    </main>
</body>
</html>
